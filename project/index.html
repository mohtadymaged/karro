<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Karro — Community Marketplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  html, body { margin:0; padding:0; background:#0A3540; min-height:100vh; }
  body { font-family: -apple-system, system-ui, sans-serif; }
  #root { min-height: 100vh; }
  /* Stop the inner scroll bars from showing visibly in the device */
  .sh::-webkit-scrollbar { display: none; }
  .sh { -ms-overflow-style: none; scrollbar-width: none; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Pure data + CSS (no JSX) -->
  <script src="data.js"></script>

  <!-- iOS frame component -->
  <script type="text/babel" src="ios-frame.jsx"></script>

  <!-- Icon stand-ins -->
  <script type="text/babel" src="icons.jsx"></script>

  <!-- Shared UI primitives -->
  <script type="text/babel" src="shared.jsx"></script>

  <!-- Pages -->
  <script type="text/babel" src="pages-market.jsx"></script>
  <script type="text/babel" src="page-item.jsx"></script>
  <script type="text/babel" src="page-sell.jsx"></script>
  <script type="text/babel" src="pages-auctions.jsx"></script>
  <script type="text/babel" src="pages-sellers.jsx"></script>
  <script type="text/babel" src="pages-home.jsx"></script>
  <script type="text/babel" src="pages-settings.jsx"></script>
  <script type="text/babel" src="pages-profile.jsx"></script>
  <script type="text/babel" src="auth.jsx"></script>
  <script type="text/babel" src="app-core.jsx"></script>

  <!-- Mount -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
